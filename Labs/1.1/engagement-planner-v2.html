<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>LAB 1.1 / Purple Team Engagement Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200;12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f1e6; --paper-2:#ece7d8; --surface:#ffffff;
  --ink:#0f1419; --ink-2:#2a2f3a; --muted:#7a7461; --muted-2:#aca48d;
  --rule:#cbc2a8; --rule-soft:#e2dcc7;
  --purple:#5b2c87; --purple-2:#7a3fb1; --purple-soft:#ece4f5;
  --red:#c8102e; --red-soft:#fbe5e8;
  --green:#2e7d32; --green-soft:#e1f0e2;
  --amber:#b07410; --amber-soft:#f9eed5;
  --display:'Bricolage Grotesque',sans-serif;
  --serif:'Newsreader',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--paper);color:var(--ink);font-family:var(--display);
  font-weight:400;font-size:14px;line-height:1.55;letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(var(--rule-soft) 1px,transparent 1px),
    linear-gradient(90deg,var(--rule-soft) 1px,transparent 1px);
  background-size:48px 48px;opacity:.55;pointer-events:none;z-index:0;
  -webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 90%);
          mask-image:radial-gradient(ellipse at center,black 30%,transparent 90%);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence baseFrequency='0.85' numOctaves='2' seed='5'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .25 0 0 0 0 .15 0 0 0 .12 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  mix-blend-mode:multiply;opacity:.5;
}
.app{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column}

/* HEADER */
header.bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:32px;padding:18px 32px 14px;border-bottom:2px solid var(--ink);background:var(--paper);position:relative}
header.bar::after{content:'';position:absolute;left:32px;right:32px;bottom:-7px;height:1px;background:var(--ink)}
.crest{display:flex;align-items:center;gap:14px}
.crest-mark{width:46px;height:46px;display:block;flex-shrink:0;filter:drop-shadow(0 1px 0 rgba(15,20,25,.05))}
.crest-id{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.22em;text-transform:uppercase;font-weight:500}
.crest-title{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.015em;color:var(--ink)}
.classif{font-family:var(--mono);font-size:9px;color:var(--red);letter-spacing:.2em;text-transform:uppercase;font-weight:700;border:1px solid var(--red);padding:2px 6px;display:inline-block;margin-top:4px}

.path{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.path .crumb{display:flex;align-items:center;gap:6px}
.path .step{display:inline-flex;width:24px;height:24px;border:1px solid var(--rule);align-items:center;justify-content:center;color:var(--muted-2);font-weight:500;position:relative}
.path .step svg{width:13px;height:13px;display:block;color:inherit}
.path .step.now svg{color:var(--paper)}
.path .step.done svg{display:none}
.path .step.done{color:var(--green);border-color:var(--green)}
.path .step.now{color:var(--paper);border-color:var(--purple);background:var(--purple);font-weight:700}
.path .lbl-dim{color:var(--muted-2)}

.gauge-wrap{display:flex;align-items:center;gap:18px;justify-content:flex-end}
.gauge{width:200px}
.gauge-label{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;margin-bottom:6px;align-items:center;font-weight:500}
.help{display:inline-grid;place-items:center;width:14px;height:14px;border:1px solid var(--muted);font-size:9px;color:var(--muted);cursor:help;font-family:var(--mono);font-weight:700;margin-left:6px;position:relative}
.help:hover .help-panel{display:block}
.help-panel{display:none;position:absolute;top:20px;right:-10px;width:280px;background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.02em;padding:12px 14px;line-height:1.55;text-transform:none;z-index:30;box-shadow:0 4px 16px rgba(15,20,25,.18)}
.help-panel::before{content:'';position:absolute;top:-6px;right:14px;width:10px;height:10px;background:var(--ink);transform:rotate(45deg)}
.gauge-label .delta{color:var(--green);font-weight:600}
.gauge-label .delta.neg{color:var(--red)}
.gauge-track{height:8px;background:var(--paper-2);position:relative;overflow:hidden;border:1px solid var(--rule)}
.gauge-fill{height:100%;background:linear-gradient(90deg,var(--red) 0%,var(--amber) 40%,var(--green) 80%);width:0%;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.gauge-num{font-family:var(--display);font-weight:800;font-size:32px;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.03em;color:var(--ink)}

/* CONSTRAINTS BAND */
.constraints{background:var(--paper-2);border-bottom:1px solid var(--rule);padding:12px 32px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:11px;min-height:42px}
.constraints-lbl{font-family:var(--mono);font-weight:700;color:var(--ink);letter-spacing:.2em;text-transform:uppercase;font-size:10px;border-left:3px solid var(--purple);padding-left:10px}
.con{display:flex;align-items:center;gap:8px;color:var(--muted)}
.con strong{color:var(--ink);font-weight:600;font-family:var(--display);font-size:13px;letter-spacing:-.005em}
.con .pill{display:inline-block;padding:2px 8px;background:var(--surface);border:1px solid var(--rule);font-size:11px;color:var(--ink);font-family:var(--display);font-weight:500;letter-spacing:-.005em}
.con .pill.warn{border-color:var(--amber);background:var(--amber-soft);color:#7a4f08}
.con-empty{color:var(--muted-2);font-style:italic;font-family:var(--serif);font-size:13px}

/* MAIN */
main{flex:1;display:grid;grid-template-columns:380px 1fr 360px;gap:0;border-bottom:1px solid var(--rule);min-height:0}

/* BRIEF */
.brief{border-right:1px solid var(--rule);padding:24px;display:flex;flex-direction:column;gap:16px;background:var(--surface);position:relative;overflow-y:auto;max-height:calc(100vh - 145px)}
.brief::after{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:repeating-linear-gradient(45deg,var(--ink) 0 6px,transparent 6px 14px);opacity:.65}
.brief-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;font-weight:600}
.dot-pulse{width:7px;height:7px;background:var(--red);box-shadow:0 0 0 0 rgba(200,16,46,.4);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,16,46,.4)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.brief h2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.02;letter-spacing:-.025em;color:var(--ink)}
.brief h2 em{font-style:italic;color:var(--purple);font-weight:700}
.brief-sub{font-family:var(--serif);font-size:14px;line-height:1.5;color:var(--ink-2);font-style:italic}
.dossier-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.dossier-cell{background:var(--surface);padding:10px 12px}
.dossier-cell .k{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:3px}
.dossier-cell .v{font-family:var(--display);font-size:13px;font-weight:500;color:var(--ink);letter-spacing:-.005em;line-height:1.3}
.intel-block{border-left:3px solid var(--purple);padding:8px 0 8px 14px}
.intel-block.warn{border-left-color:var(--amber)}
.intel-block .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:600}
.intel-block.warn .lbl{color:var(--amber)}
.intel-list{display:flex;flex-direction:column;gap:5px;list-style:none}
.intel-list li{display:flex;gap:10px;align-items:flex-start;font-family:var(--mono);font-size:12px;color:var(--ink-2);line-height:1.45}
.intel-list li::before{content:'›';color:var(--purple);font-weight:700;flex-shrink:0}
.intel-block.warn .intel-list li::before{color:var(--amber)}
.briefcase{background:var(--paper);border:1px solid var(--rule);padding:12px 14px;font-family:var(--serif);font-size:13px;line-height:1.55;color:var(--ink-2)}
.briefcase .case-h{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:6px}
.briefcase em{font-style:italic;color:var(--ink)}
.brief-hint{font-size:13px;color:var(--ink-2);margin-top:4px;line-height:1.55;font-family:var(--serif)}
.brief-hint b{color:var(--ink);font-weight:600;font-family:var(--display)}
.brief-hint i{font-style:italic}

/* CENTER PANEL */
.workzone{padding:24px 32px;display:flex;flex-direction:column;gap:18px;min-width:0;overflow-y:auto;max-height:calc(100vh - 145px)}
.zone-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.zone-head h1{font-family:var(--display);font-weight:800;font-size:38px;line-height:.95;letter-spacing:-.03em;color:var(--ink)}
.zone-head h1 .num{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--muted);display:block;letter-spacing:.18em;margin-bottom:10px}
.zone-head p{color:var(--ink-2);font-size:14px;max-width:62ch;font-family:var(--serif);line-height:1.5}

.filter-row{display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);flex-wrap:wrap}
.filter-row > span{font-weight:600;margin-right:4px}
.filter-row button{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;background:var(--surface);color:var(--muted);border:1px solid var(--rule);padding:6px 10px;cursor:pointer;transition:all .15s;font-weight:500}
.filter-row button:hover{color:var(--ink);border-color:var(--ink)}
.filter-row button.active{color:var(--paper);background:var(--ink);border-color:var(--ink)}

/* card grid + cards (used by multiple sections) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.card{background:var(--surface);padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;position:relative;transition:background .15s;user-select:none;min-height:120px}
.card:hover{background:#fffdf6}
.card.selected{background:var(--purple-soft);outline:2px solid var(--purple);outline-offset:-2px}
.card .sel-tag{display:none;position:absolute;top:8px;right:10px;font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--purple);font-weight:700}
.card.selected .sel-tag{display:block}
.card-id{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;font-weight:500}
.card-name{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.2;letter-spacing:-.015em;color:var(--ink)}
.card-desc{font-family:var(--serif);font-size:12.5px;color:var(--ink-2);line-height:1.45;font-style:italic}
.card-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
.tag{padding:3px 6px;border:1px solid var(--rule);color:var(--muted);background:var(--paper)}
.tag.tactic{color:var(--ink);border-color:var(--rule);background:var(--paper-2)}
.tag.risk-high{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.tag.risk-med{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
.tag.risk-low{color:var(--muted);border-color:var(--rule);background:var(--paper)}
.tag.cost{color:var(--ink);border-color:var(--ink)}
.tag.role-cloud{color:var(--purple);border-color:var(--purple);background:var(--purple-soft)}
.tag.skill{color:var(--ink-2);border-color:var(--rule);background:var(--surface)}

/* RIGHT PANEL (loadout/status) */
.loadout{border-left:1px solid var(--rule);background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:22px;overflow-y:auto;max-height:calc(100vh - 145px)}
.lo-head{display:flex;justify-content:space-between;align-items:baseline}
.lo-head .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lo-head .count{font-family:var(--display);font-weight:800;font-size:36px;letter-spacing:-.035em;font-variant-numeric:tabular-nums;color:var(--ink)}
.lo-head .count em{color:var(--purple);font-style:normal}
.lo-list{display:flex;flex-direction:column;gap:5px}
.lo-empty{border:1.5px dashed var(--rule);padding:22px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted-2);letter-spacing:.12em;text-transform:uppercase;font-weight:500}
.lo-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 12px;background:var(--paper);border-left:3px solid var(--purple);font-family:var(--mono);font-size:12px}
.lo-item .id{color:var(--muted);font-weight:500}
.lo-item .nm{color:var(--ink);font-family:var(--display);font-size:13px;font-weight:500;letter-spacing:-.005em}
.lo-item .x{cursor:pointer;color:var(--muted);padding:0 4px;font-size:16px;line-height:1}
.lo-item .x:hover{color:var(--red)}
.section-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:600}
.cov-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.cov{position:relative;aspect-ratio:1;border:1px solid var(--rule);background:var(--paper);display:grid;place-items:center;font-family:var(--mono);font-size:9px;color:var(--muted-2);letter-spacing:.04em;font-weight:600;transition:all .2s}
.cov.hit{background:var(--purple);border-color:var(--purple);color:var(--paper)}
.con-list{display:flex;flex-direction:column;gap:10px}
.con-live{display:flex;flex-direction:column;gap:5px;padding-bottom:9px;border-bottom:1px dashed var(--rule)}
.con-live:last-child{border-bottom:0;padding-bottom:0}
.con-live .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.con-live .lbl{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.con-live .val{font-family:var(--display);font-size:12px;font-weight:600;color:var(--ink);letter-spacing:-.005em;font-variant-numeric:tabular-nums}
.con-live .val.warn{color:var(--amber)}
.con-live .val.bad{color:var(--red)}
.con-bar{height:5px;background:var(--paper-2);position:relative;overflow:hidden;border:1px solid var(--rule)}
.con-bar-fill{height:100%;background:var(--purple);transition:width .4s cubic-bezier(.2,.8,.2,1),background .2s;width:0%}
.con-bar-fill.warn{background:var(--amber)}
.con-bar-fill.bad{background:var(--red)}
.con-meta{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.02em;line-height:1.4}
.con-meta.warn{color:var(--amber)}
.con-meta.bad{color:var(--red)}

/* DETECTION-SPECIFIC */
.det-row{background:var(--surface);border:1px solid var(--rule);padding:14px 16px;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.det-ttp{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap}
.det-ttp .id{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500}
.det-ttp .nm{font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink);letter-spacing:-.01em}
.det-ttp .ct{font-family:var(--mono);font-size:11px;color:var(--purple);letter-spacing:.08em;font-weight:600}
.det-options{display:flex;gap:6px;flex-wrap:wrap}
.det-opt{font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:6px 10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer;transition:all .15s;font-weight:500;user-select:none}
.det-opt:hover{border-color:var(--ink);background:var(--paper-2)}
.det-opt.selected{background:var(--purple);color:var(--paper);border-color:var(--purple);font-weight:700}

/* SCORECARD (final section) — span the full main grid */
.scorecard{grid-column:1 / -1;padding:24px 32px;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:24px;width:100%}
.score-final{display:flex;justify-content:space-between;align-items:center;padding:24px 32px;background:var(--ink);color:var(--paper);position:relative}
.score-final::before{content:'';position:absolute;left:0;right:0;top:-7px;height:6px;background:repeating-linear-gradient(45deg,var(--red) 0 8px,var(--ink) 8px 16px)}
.score-final .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;color:#cbc2a8;margin-bottom:6px}
.score-final h3{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.025em;line-height:1}
.score-final .num{font-family:var(--display);font-weight:800;font-size:64px;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.score-final .num small{font-size:24px;color:var(--muted-2);font-weight:500;margin-left:4px}
.score-bar{flex:1;max-width:340px;margin:0 24px}
.score-bar-track{height:12px;background:#2a2f3a;position:relative;border:1px solid #3a4053}
.score-bar-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--amber) 50%,var(--green))}

/* SCORE explanations + REVIEW */
.bd-explain{
  grid-column:1 / -1;font-family:var(--serif);font-size:12.5px;color:var(--ink-2);
  font-style:italic;line-height:1.5;padding:6px 0 10px;border-bottom:1px dashed var(--rule);
}
.bd-explain:last-child{border-bottom:0}
.bd-pen-card{background:var(--surface);border:1px solid var(--rule);padding:18px 20px;margin-bottom:10px}
.bd-pen-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-bottom:10px}
.bd-pen-head .name{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.005em;color:var(--ink)}
.bd-pen-head .pts{font-family:var(--display);font-weight:800;font-size:24px;color:var(--red);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bd-pen-head .pts.ok{color:var(--green)}
.bd-pen-grid{display:grid;grid-template-columns:80px 1fr;gap:6px 14px;font-family:var(--serif);font-size:13px;line-height:1.55;color:var(--ink-2)}
.bd-pen-grid .lbl{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:3px}
.bd-pen-grid .val em{font-style:italic;color:var(--ink);font-weight:600;font-family:var(--display)}
.bd-section{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);font-weight:700;border-bottom:2px solid var(--ink);padding-bottom:6px;margin:24px 0 14px}

.review-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.review-card{background:var(--surface);border:1px solid var(--rule);padding:16px 18px}
.review-card h5{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:8px;border-bottom:1px solid var(--rule);padding-bottom:6px}
.review-card .v-main{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:-.01em;color:var(--ink);line-height:1.3}
.review-card ul{list-style:none;display:flex;flex-direction:column;gap:4px}
.review-card li{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);letter-spacing:0;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.review-card li::before{content:'›';color:var(--purple);font-weight:700;flex-shrink:0}
.review-card .meta{font-family:var(--serif);font-size:12.5px;color:var(--muted);font-style:italic;margin-top:6px}

.review-callout{
  background:var(--ink);color:var(--paper);padding:20px 24px;
  border-left:4px solid var(--red);
  font-family:var(--serif);font-size:14.5px;line-height:1.55;
  margin-bottom:24px;
}
.review-callout strong{font-family:var(--display);color:var(--paper);font-weight:700;display:block;margin-bottom:4px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-family:var(--mono)}
.review-callout em{font-style:italic;color:#cbc2a8}

.scorecard.full{padding:32px 48px;max-width:1280px;margin:0 auto}

.breakdown-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.bd-card{background:var(--surface);border:1px solid var(--rule);padding:18px}
.bd-card h4{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:12px;border-bottom:1px solid var(--rule);padding-bottom:8px}
.bd-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--rule);font-family:var(--mono);font-size:12px}
.bd-row:last-child{border-bottom:0}
.bd-row .k{font-family:var(--display);font-weight:600;font-size:13px;color:var(--ink);letter-spacing:-.005em}
.bd-row .meta{font-family:var(--serif);font-size:11.5px;color:var(--muted);font-style:italic;line-height:1.4}
.bd-row .v{font-family:var(--display);font-weight:700;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.bd-row .v.bad{color:var(--red)}
.bd-row .v.ok{color:var(--green)}
.bd-row .v.warn{color:var(--amber)}
.bd-row.ttp-pick-row{display:block;padding:14px 0}
.bd-row.ttp-pick-row .ttp-pick-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.bd-row.ttp-pick-row .ttp-pick-reason{font-family:var(--serif);font-size:13px;line-height:1.55;color:var(--ink-2);margin-top:6px;padding-left:0}
.badge{font-family:var(--mono);font-weight:700;font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:3px 7px;border:1px solid var(--ink)}
.badge.ok{color:var(--green);border-color:var(--green);background:var(--green-soft)}
.badge.dev{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
.badge.bad{color:var(--red);border-color:var(--red);background:var(--red-soft)}

.foot{padding:18px 32px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--rule);background:var(--paper);gap:16px;flex-wrap:wrap}
.foot .legend{display:flex;gap:18px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);flex-wrap:wrap;font-weight:500}
.foot .legend i{display:inline-block;width:8px;height:8px;margin-right:6px;vertical-align:middle;border:1px solid var(--ink)}
.foot .legend i.g{background:var(--green);border-color:var(--green)}
.foot .legend i.a{background:var(--amber);border-color:var(--amber)}
.foot .legend i.r{background:var(--red);border-color:var(--red)}
.btn{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:14px 28px;cursor:pointer;background:var(--ink);color:var(--paper);border:0;position:relative;transition:all .15s}
.btn:disabled{background:var(--rule);color:var(--muted-2);cursor:not-allowed}
.btn:not(:disabled):hover{background:var(--purple)}
.btn::after{content:'→';margin-left:10px;display:inline-block;transition:transform .2s}
.btn:not(:disabled):hover::after{transform:translateX(4px)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--rule)}
.btn.ghost::after{content:'';margin:0}
.btn.ghost::before{content:'←';margin-right:10px}
.btn.ghost:hover{color:var(--ink);border-color:var(--ink);background:transparent}
.btn.outline{background:var(--surface);color:var(--ink);border:1.5px solid var(--ink)}

.btn.outline:hover{background:var(--ink);color:var(--paper)}
.btn-reset{font-family:var(--mono);font-weight:700;font-size:10px;letter-spacing:.18em;text-transform:uppercase;padding:8px 14px;cursor:pointer;background:transparent;color:var(--muted);border:1px solid var(--rule);transition:all .15s}
.btn-reset:hover{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.iopt.danger{border-color:var(--red)}
.iopt.danger::before{color:var(--red);content:'⚠'}
.iopt.danger:hover{background:var(--red-soft);border-color:var(--red)}
.iopt.danger:hover::before{color:var(--red);content:'⚠'}

/* INJECT MODAL */
.imodal{position:fixed;inset:0;background:rgba(15,20,25,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:48px 24px;overflow:auto}

.icard{background:var(--paper);width:min(720px,100%);border:1.5px solid var(--ink);position:relative}
.icard::before{content:'';position:absolute;left:0;right:0;top:-7px;height:6px;background:repeating-linear-gradient(45deg,var(--red) 0 8px,var(--ink) 8px 16px)}
.ihead{padding:24px 28px 18px;border-bottom:1px solid var(--rule)}
.ieyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:8px}
.ititle{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;color:var(--ink);line-height:1.1}
.ibody{padding:18px 28px;font-family:var(--serif);font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.ibody em{font-style:italic;color:var(--ink)}
.iopts{padding:0 28px 28px;display:flex;flex-direction:column;gap:6px}
.iopt{background:var(--surface);border:1px solid var(--rule);padding:14px 18px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:14px;color:var(--ink);letter-spacing:-.005em;font-weight:500;text-align:left}
.iopt:hover{border-color:var(--ink);background:var(--paper-2);transform:translateX(2px)}
.iopt::before{content:'◯';color:var(--muted);font-family:var(--mono);flex-shrink:0;font-size:14px}
.iopt:hover::before{color:var(--purple);content:'●'}

/* TOAST */
.toasts{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--purple);padding:12px 16px;font-family:var(--mono);font-size:11px;color:var(--ink);max-width:340px;letter-spacing:.02em;animation:slidein .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 6px 18px rgba(15,20,25,.08)}
.toast strong{font-family:var(--display);font-weight:700;letter-spacing:-.005em;display:block;margin-bottom:4px;font-size:13px}
.toast em{color:var(--purple);font-style:normal;font-weight:600}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideout{to{transform:translateX(20px);opacity:0}}
.toast.gone{animation:slideout .3s forwards}

/* BRIEFING (sec 1) layout — single full panel spans the main grid */
.full-zone{grid-column:1 / -1;padding:32px 48px;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:24px;width:100%}
.full-zone .stamp{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--red);font-weight:700;border:1px solid var(--red);padding:4px 10px;align-self:flex-start}

.full-zone h1 em{font-style:italic;color:var(--purple);font-weight:700}
.full-zone .lede{font-family:var(--serif);font-size:18px;line-height:1.5;color:var(--ink-2);max-width:62ch}
.full-zone .lede em{font-style:italic;color:var(--ink)}

.rules-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.rule-cell{background:var(--surface);padding:18px 20px;display:flex;gap:14px;align-items:flex-start}
.rule-cell .num{font-family:var(--display);font-weight:800;font-size:32px;color:var(--purple);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em;flex-shrink:0;width:36px}
.rule-cell .body h4{font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink);margin-bottom:4px;letter-spacing:-.005em}
.rule-cell .body p{font-family:var(--serif);font-size:13px;color:var(--ink-2);line-height:1.5}

.scenario-card{background:var(--paper-2);border:1px solid var(--rule);padding:20px 24px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:flex-start}
.scenario-card .label{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--red);font-weight:700;writing-mode:vertical-rl;transform:rotate(180deg);align-self:stretch}
.scenario-card .body{font-family:var(--serif);font-size:14px;line-height:1.55;color:var(--ink-2)}
.scenario-card .body strong{color:var(--ink);font-family:var(--display);font-weight:700;letter-spacing:-.005em}

@media (max-width:1100px){
  main{grid-template-columns:1fr}
  .brief,.loadout{border:0;border-bottom:1px solid var(--rule);max-height:none}
  .breakdown-grid,.rules-grid{grid-template-columns:1fr}
}
</style>

/* =====================================================================
   SCORING (per-section + cross-section)
===================================================================== */
const WEIGHTS = {objective:10, roe:12, roles:14, environment:14, ttps:25, detection:25};

function scoreObjective(s){
  if(!s.objective) return 0;
  const o = OBJECTIVES.find(x=>x.id===s.objective);
  return o ? o.score : 0;
}
function scoreRoe(s){
  let pts = 0;
  s.roe.forEach(id=>{
    const c = ROE_CLAUSES.find(x=>x.id===id);
    if(!c) return;
    if(c.type === 'required')    pts += 3;
    if(c.type === 'recommended') pts += 1.5;
    if(c.type === 'trap')        pts -= c.cost;
    if(c.type === 'restrictive') pts -= c.cost;
  });
  return Math.max(0, Math.min(WEIGHTS.roe, pts));
}
function scoreRoles(s){
  let pts = 0;
  const picked = s.roles.map(id => ROLES_POOL.find(r=>r.id===id)).filter(Boolean);
  // 4 required roles present => 2pt each
  ROLES_POOL.filter(r=>r.required).forEach(req=>{
    if(picked.some(p=>p.id===req.id)) pts += 2;
  });
  // budget OK
  const totalCost = picked.reduce((a,r)=>a + r.cost*5, 0); // 5-day FTE
  if(totalCost <= ROLES_BUDGET_TOTAL) pts += 4;
  // size 4..6
  if(picked.length >= 4 && picked.length <= 6) pts += 2;
  return Math.max(0, Math.min(WEIGHTS.roles, pts));
}
function scoreEnvironment(s){
  let pts = 0;
  const picked = s.environment.map(id => ENVIRONMENT_SENSORS.find(e=>e.id===id)).filter(Boolean);
  // critical zones covered
  ENVIRONMENT_SENSORS.filter(e=>e.critical).forEach(crit=>{
    if(picked.some(p=>p.id===crit.id)) pts += 3;
  });
  // budget OK
  const total = picked.reduce((a,e)=>a+e.cost,0);
  if(total <= ENV_BUDGET) pts += 3;
  // no redundant + no irrelevant
  const hasRed = picked.some(p=>p.redundant);
  const hasIrrel = picked.some(p=>p.irrelevant);
  if(!hasRed && !hasIrrel) pts += 2;
  return Math.max(0, Math.min(WEIGHTS.environment, pts));
}
function scoreTtps(s){
  let pts = 0;
  const picked = s.ttps.map(id => TTPS.find(t=>t.id===id)).filter(Boolean);
  picked.forEach(t=>{ if(t.tag==='observed') pts += 3.5; });
  const tactics = new Set(picked.map(t=>t.tactic));
  ['IA','EX','CR','EXFIL'].forEach(k=>{ if(tactics.has(k)) pts += 1; });
  return Math.max(0, Math.min(WEIGHTS.ttps, pts));
}
function scoreDetection(s){
  let pts = 0;
  const ttps = s.ttps.map(id => TTPS.find(t=>t.id===id)).filter(Boolean);
  const credit = WEIGHTS.detection / Math.max(1, ttps.length);
  ttps.forEach(t=>{
    const techIds = (s.detectionMap[t.id] || []);
    if(techIds.length === 0) return;
    const techs = techIds.map(id => DETECTIONS.find(d=>d.id===id)).filter(Boolean);
    const anyCovers = techs.some(d => d.covers.includes(t.tactic));
    const anyIrrelevant = techs.some(d => d.covers.length === 0);
    if(anyCovers) pts += credit;
    if(anyIrrelevant) pts -= 1;
  });
  return Math.max(0, Math.min(WEIGHTS.detection, pts));
}

function crossPenalties(s){
  const p = [];
  const ttps = s.ttps.map(id => TTPS.find(t=>t.id===id)).filter(Boolean);
  const skills = new Set(s.roles.flatMap(id => (ROLES_POOL.find(r=>r.id===id)||{skills:[]}).skills));
  // cloud TTP without cloud-sec role
  const cloudTtps = ttps.filter(t=>t.role==='cloud');
  if(cloudTtps.length > 0 && !skills.has('cloud')){
    p.push({key:'cloud_role_gap', label:'Cloud TTP without cloud-sec role', count:cloudTtps.length, perItem:3});
  }
  // CTI-dependent TTP without CTI Analyst (the analyst keeps actor attribution and TTP set current)
  const ctiTtps = ttps.filter(t=>t.requires==='cti');
  if(ctiTtps.length > 0 && !skills.has('cti')){
    p.push({key:'cti_role_gap', label:'CTI-dependent TTP without CTI analyst', count:ctiTtps.length, perItem:3});
  }
  // RoE-violating TTPs
  const roeViol = ttps.filter(t=>t.violates==='roe');
  if(roeViol.length > 0){
    p.push({key:'roe_viol', label:'RoE-violating TTP picked', count:roeViol.length, perItem:8});
  }
  // Detection budget bust
  const ttpCost = ttps.reduce((a,t)=>a+t.cost,0);
  if(ttpCost > TTP_BUDGET){
    p.push({key:'ttp_budget', label:'TTP licensing budget exceeded', count:1, perItem:5});
  }
  // Detection coverage gap
  const gaps = ttps.filter(t => {
    const techs = (s.detectionMap[t.id] || []).map(id => DETECTIONS.find(d=>d.id===id)).filter(Boolean);
    return techs.length === 0 || !techs.some(d => d.covers.includes(t.tactic));
  });
  if(gaps.length > 0){
    p.push({key:'cov_gap', label:'TTP without aligned detection', count:gaps.length, perItem:3});
  }
  return p;
}

function scoreInjects(s){
  let pts = 0;
  for(const injId of s.injectQueue){
    const optId = s.injectsResponded[injId];
    if(!optId) continue;
    const inj = INJECTS.find(i => i.id === injId); if(!inj) continue;
    const opt = inj.options.find(o => o.id === optId); if(!opt) continue;
    pts += opt.score;
  }
  return pts;
}

function computeScore(s){
  const sec = {
    objective:   scoreObjective(s),
    roe:         scoreRoe(s),
    roles:       scoreRoles(s),
    environment: scoreEnvironment(s),
    ttps:        scoreTtps(s),
    detection:   scoreDetection(s),
  };
  const subtotal = Object.values(sec).reduce((a,b)=>a+b, 0);
  const penalties = crossPenalties(s);
  const penTotal = penalties.reduce((a,p)=>a + p.count*p.perItem, 0);
  const injectPts = scoreInjects(s);
  const final = Math.max(0, Math.min(100, Math.round(subtotal - penTotal + injectPts)));
  return {sec, subtotal, penalties, penTotal, injectPts, final};
}

// Live gauge: only includes COMPLETED sections (no penalties applied)
function liveGauge(s){
  let pts = 0;
  if(s.step > 1) pts += scoreObjective(s);
  if(s.step > 2) pts += scoreRoe(s);
  if(s.step > 3) pts += scoreRoles(s);
  if(s.step > 4) pts += scoreEnvironment(s);
  if(s.step > 5) pts += scoreTtps(s);
  if(s.step > 6) pts += scoreDetection(s);
  return Math.round(pts);
}

  if(opts.text != null) e.textContent = opts.text;
  if(opts.title) e.title = opts.title;
  if(opts.id) e.id = opts.id;
  if(opts.data) for(const k in opts.data) e.dataset[k] = opts.data[k];
  if(opts.attrs) for(const k in opts.attrs) e.setAttribute(k, opts.attrs[k]);
  return e;
};
const svgEl = (name, attrs={}) => {

  for(const k in attrs) e.setAttribute(k, attrs[k]);

};

function renderPath(){
  const p = document.getElementById('path');
  clear(p);
  STEPS.forEach((stp, i)=>{
    const stClass = i < state.step ? 'done' : i === state.step ? 'now' : '';
    const c = el('div',{cls:'crumb'});
    const stepEl = el('span',{cls:'step ' + stClass});
    if(stClass === 'done') stepEl.textContent = '✓';
    else if(ICONS[stp.icon]) stepEl.appendChild(ICONS[stp.icon]());
    c.appendChild(stepEl);
    c.appendChild(el('span',{cls: stClass==='now' ? '' : 'lbl-dim', text:stp.label}));
    p.appendChild(c);
  });
}

let prevGauge = 0;
function renderGauge(){
  const v = liveGauge(state);
  document.getElementById('gfill').style.width = v + '%';
  document.getElementById('gnum').textContent = String(v).padStart(2,'0');
  const d = v - prevGauge;
  const $delta = document.getElementById('delta');
  $delta.textContent = (d>=0?'+':'') + d;
  $delta.classList.toggle('neg', d<0);
  prevGauge = v;
}

function renderConstraintsBand(){
  const band = document.getElementById('constraints');
  clear(band);
  band.appendChild(el('div',{cls:'constraints-lbl', text:'Carried Forward'}));
  if(state.step === 0){
    band.appendChild(el('div',{cls:'con-empty', text:'No prior decisions yet — Briefing in progress.'}));
    return;
  }
  if(state.objective){
    const o = OBJECTIVES.find(x=>x.id===state.objective);
    const c = el('div',{cls:'con'});
    c.appendChild(el('strong',{text:'Objective'}));
    c.appendChild(el('span',{cls:'pill', text:o.label.length>50 ? o.label.slice(0,48)+'…' : o.label}));
    band.appendChild(c);
  }
  if(state.roe.length){
    const traps = state.roe.filter(id => {
      const x = ROE_CLAUSES.find(c=>c.id===id); return x && (x.type==='trap' || x.type==='restrictive');
    }).length;
    const c = el('div',{cls:'con'});
    c.appendChild(el('strong',{text:'RoE'}));
    c.appendChild(el('span',{cls:'pill ' + (traps?'warn':''), text:`${state.roe.length} clauses${traps ? ' · ' + traps + ' risky' : ''}`}));
    band.appendChild(c);
  }
  if(state.roles.length){
    const skills = new Set(state.roles.flatMap(id => (ROLES_POOL.find(r=>r.id===id)||{skills:[]}).skills));
    const lacksCloud = !skills.has('cloud');
    const c = el('div',{cls:'con'});
    c.appendChild(el('strong',{text:'Roles'}));
    c.appendChild(el('span',{cls:'pill ' + (lacksCloud?'warn':''), text:`${state.roles.length} hired${lacksCloud ? ' · no cloud' : ''}`}));
    band.appendChild(c);
  }
  if(state.environment.length){
    const c = el('div',{cls:'con'});
    c.appendChild(el('strong',{text:'Sensors'}));
    c.appendChild(el('span',{cls:'pill', text:`${state.environment.length} deployed`}));
    band.appendChild(c);
  }
  if(state.ttps.length){
    const c = el('div',{cls:'con'});
    c.appendChild(el('strong',{text:'TTPs'}));
    c.appendChild(el('span',{cls:'pill', text:`${state.ttps.length} of 6`}));
    band.appendChild(c);
  }
  // window/budget always visible from objective onward
  if(state.step > 0){
    const c = el('div',{cls:'con'});
    c.appendChild(el('strong',{text:'Window'}));
    c.appendChild(el('span',{cls:'pill', text:'5 days exec'}));
    band.appendChild(c);
  }
}

function toast({title='', body='', em=''}){
  const t = el('div',{cls:'toast'});
  t.appendChild(el('strong',{text:title}));
  if(em) t.appendChild(el('em',{text:em}));
  if(body) t.appendChild(document.createTextNode(body));
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>{
    t.classList.add('gone');
    setTimeout(()=>t.remove(), 300);
  }, 2800);
}

  clear($main);

    3: renderRoles,

    6: renderDetection,

  })[state.step]();
  $btnBack.style.visibility = state.step === 0 ? 'hidden' : 'visible';
  if(state.step === STEPS.length - 1){

/* ===== Helpers for Score ===== */
function objectiveExplanation(s){
  if(!s.objective) return 'No objective picked.';
  const o = OBJECTIVES.find(x=>x.id===s.objective);
  const head = `Earned ${o.score} of ${WEIGHTS.objective} pts. `;
  if(o.score === 10) return head + 'Picked the concrete, measurable target tied to Crimson Viper’s actual tempo. The SOC can validate the engagement against an unambiguous bar (24h MTTD against a 3–5 day kill chain).';
  if(o.score === 5)  return head + 'Compliance-first objective. PCI-DSS Req 11.4 is a real annual deliverable, but it does not exercise the SOC against an adversary kill chain — the engagement satisfies auditors without proving detection coverage.';
  if(o.score === 4)  return head + 'Red-team mindset, not purple-team. Maximizing finding count rewards breadth over depth and disconnects the engagement from a specific adversary. Coverage validation against Crimson Viper is left unmeasured.';
  if(o.score === 3)  return head + '"All attackers" is unmeasurable. The team cannot say at engagement end whether they succeeded — what counts as "all"? Hunt-style framing without a target produces no testable hypothesis.';
  if(o.score === 2)  return head + 'Zero-day discovery is vulnerability research (fuzzing, reverse engineering, source review), not purple team. There is nothing to detect for a vulnerability that does not yet exist publicly, so the engagement loop has no Blue side.';
  return head;
}
function roeExplanation(s){
  const picked = s.roe.map(id=>ROE_CLAUSES.find(x=>x.id===id)).filter(Boolean);
  const req = picked.filter(p=>p.type==='required').length;
  const rec = picked.filter(p=>p.type==='recommended').length;
  const trap = picked.filter(p=>p.type==='trap');
  const restr = picked.filter(p=>p.type==='restrictive');
  const allReq = ROE_CLAUSES.filter(c=>c.type==='required').length;
  const parts = [];
  parts.push(`${req}/${allReq} required clauses (+${req*3} pts)`);
  if(rec) parts.push(`${rec} recommended (+${(rec*1.5).toFixed(1)} pts)`);
  if(trap.length){
    const names = trap.map(t=>t.label).join('; ');
    parts.push(`${trap.length} trap clause${trap.length>1?'s':''} − ${names} (−${trap.reduce((a,t)=>a+t.cost,0)} pts)`);
  }
  if(restr.length){
    parts.push(`${restr.length} over-restrictive clause${restr.length>1?'s':''} (−${restr.reduce((a,r)=>a+r.cost,0)} pts)`);
  }
  const tail = trap.length ? ' Trap clauses (e.g. monitoring without consent) carry legal/reputational risk and are heavily penalized.' :
              restr.length ? ' Over-restrictive clauses (e.g. manual approval per action) bog the engagement down to the point where it cannot complete in window.' :
              ' Strong RoE: required protections present, no over-restrictive or legally-risky clauses.';
  return parts.join(' · ') + '.' + tail;
}
function rolesExplanation(s){
  const picked = s.roles.map(id=>ROLES_POOL.find(x=>x.id===id)).filter(Boolean);
  const reqHired = ROLES_POOL.filter(r=>r.required && s.roles.includes(r.id)).map(r=>r.name);
  const reqMissing = ROLES_POOL.filter(r=>r.required && !s.roles.includes(r.id)).map(r=>r.name);
  const cost = picked.reduce((a,r)=>a+r.cost*5, 0);
  const sizeOK = picked.length >= 4 && picked.length <= 6;
  const budgetOK = cost <= ROLES_BUDGET_TOTAL;
  const parts = [
    `${reqHired.length}/4 required roles covered (+${reqHired.length*2} pts)`,
    `${sizeOK ? `team size ${picked.length} (4–6 sweet spot, +2 pts)` : `team size ${picked.length} (outside 4–6 band, no size bonus)`}`,
    `${budgetOK ? `$${(cost/1000).toFixed(1)}K of $${(ROLES_BUDGET_TOTAL/1000).toFixed(0)}K FTE budget (+4 pts)` : `$${(cost/1000).toFixed(1)}K — over $${(ROLES_BUDGET_TOTAL/1000).toFixed(0)}K budget`}`,
  ];
  let tail = '';
  if(reqMissing.length) tail = ` Missing: ${reqMissing.join(', ')} — required for engagement coordination, detection authoring, intel currency, or program management.`;
  return parts.join(' · ') + '.' + tail;
}
function envExplanation(s){
  const picked = s.environment.map(id=>ENVIRONMENT_SENSORS.find(x=>x.id===id)).filter(Boolean);
  const crits = ENVIRONMENT_SENSORS.filter(e=>e.critical);
  const critHit = crits.filter(c=>picked.some(p=>p.id===c.id));
  const critMiss = crits.filter(c=>!picked.some(p=>p.id===c.id));
  const tot = picked.reduce((a,e)=>a+e.cost, 0);
  const budgetOK = tot <= ENV_BUDGET;
  const red = picked.filter(p=>p.redundant);
  const irrel = picked.filter(p=>p.irrelevant);
  const parts = [
    `${critHit.length}/4 critical zones covered (+${critHit.length*3} pts)`,
    `${budgetOK ? `$${(tot/1000).toFixed(1)}K of $${(ENV_BUDGET/1000).toFixed(0)}K env budget (+3 pts)` : `$${(tot/1000).toFixed(1)}K over budget`}`,
    `${(red.length===0 && irrel.length===0) ? 'no redundant/irrelevant sensors (+2 pts)' : 'discipline penalty applied'}`,
  ];
  let tail = '';
  if(critMiss.length) tail += ` Missing critical: ${critMiss.map(c=>c.name).join(', ')} — these gate the detections you can map in Section 07.`;
  if(red.length) tail += ` Redundant sensor (Duplicate Workstation EDR) wastes budget without adding coverage.`;
  if(irrel.length) tail += ` Irrelevant sensor (OT/ICS Network Tap) does not apply to a fintech environment.`;
  return parts.join(' · ') + '.' + tail;
}
function ttpsExplanation(s){
  const picked = s.ttps.map(id=>TTPS.find(x=>x.id===id)).filter(Boolean);
  const obs = picked.filter(t=>t.tag==='observed');
  const oth = picked.filter(t=>t.tag==='other');
  const noi = picked.filter(t=>t.tag==='noise');
  const tactics = new Set(picked.map(t=>t.tactic));
  const crits = ['IA','EX','CR','EXFIL'];
  const critCovered = crits.filter(k=>tactics.has(k));
  const critMissing = crits.filter(k=>!tactics.has(k));
  const parts = [
    `${obs.length} CV-observed (+${(obs.length*3.5).toFixed(1)} pts)`,
    `${oth.length} other-actor TTPs (0 fit credit — burns a slot without scoring it)`,
    `${noi.length} off-profile/noise TTPs (0 fit credit — and Crimson Viper would not run them)`,
    `${critCovered.length}/4 critical kill-chain tactics covered (+${critCovered.length} pts)`,
  ];
  let tail = '';
  if(critMissing.length) tail += ` Missing critical tactics: ${critMissing.join(', ')} — gaps here mean the kill chain has unmonitored steps.`;
  if(noi.length) tail += ` Off-profile picks: ${noi.map(t=>t.id).join(', ')} — unrelated to the actor profile.`;
  return parts.join(' · ') + '.' + tail;
}
function detectionExplanation(s){
  const ttps = s.ttps.map(id=>TTPS.find(x=>x.id===id)).filter(Boolean);
  let aligned = 0, irrelevant = 0, unmapped = 0;
  const credit = WEIGHTS.detection / Math.max(1, ttps.length);
  ttps.forEach(t=>{
    const techIds = s.detectionMap[t.id] || [];
    if(techIds.length === 0){ unmapped++; return; }
    const techs = techIds.map(id=>DETECTIONS.find(d=>d.id===id)).filter(Boolean);
    if(techs.some(d => d.covers.includes(t.tactic))) aligned++;
    if(techs.some(d => d.covers.length === 0)) irrelevant++;
  });
  const parts = [
    `${aligned}/${ttps.length} TTPs mapped to a tactic-aligned detection (+${(aligned*credit).toFixed(1)} pts at ${credit.toFixed(1)}/match)`,
  ];
  if(unmapped) parts.push(`${unmapped} TTP${unmapped>1?'s':''} with no detection mapped — also triggers a cross-section coverage-gap penalty`);
  if(irrelevant) parts.push(`${irrelevant} red-herring detection${irrelevant>1?'s':''} mapped (e.g. Mainframe Audit, OT/ICS) (−${irrelevant} pts)`);
  let tail = ` Available detection pool was filtered to what your Section 05 sensors actually deploy — gaps here often trace back to a missing sensor.`;
  return parts.join(' · ') + '.' + tail;
}

function ttpReason(t){
  return TTP_REASONS[t.id] || (t.tag==='observed' ? 'Aligned with Crimson Viper TTP set.' :
                               t.tag==='other'    ? 'Belongs to a different actor profile.' :
                                                    'Off-profile for the actor and the environment.');
}

function bracket(score){
  if(score >= 90) return {label:'Tight, coherent, ready for sign-off', cls:'ok'};
  if(score >= 70) return {label:'Sound but with 1–2 misalignments — revisit one section', cls:'warn'};
  if(score >= 50) return {label:'Multiple sections diverge — needs a second pass', cls:'warn'};
  return {label:'Plan would not survive contact with Crimson Viper', cls:'bad'};
}

// Top-of-scorecard narrative: turn the numeric result into a paragraph that explains
// *why* the score landed where it did and *what to do next*.
function scorecardNarrative(result){
  const lines = [];
  // Best section (highest ratio earned vs weight)
  const ratios = Object.entries(result.sec).map(([k,v]) => ({k, v, max:WEIGHTS[k], r:v/WEIGHTS[k]}));
  ratios.sort((a,b)=>b.r-a.r);
  const strongest = ratios[0];
  const weakest   = ratios[ratios.length-1];
  const SECTION_LABEL = {objective:'Objective', roe:'RoE', roles:'Roles', environment:'Environment', ttps:'TTPs', detection:'Detection'};
  if(strongest.r >= 0.9) lines.push(`Strongest section: ${SECTION_LABEL[strongest.k]} (${strongest.v.toFixed(1)}/${strongest.max}). Anchor your plan here on rerun.`);
  if(weakest.r < 0.5)    lines.push(`Weakest section: ${SECTION_LABEL[weakest.k]} (${weakest.v.toFixed(1)}/${weakest.max}). This is the highest-leverage retry.`);
  // Penalty narrative
  if(result.penalties.length === 0){
    lines.push('No cross-section penalties: your decisions in one section did not invalidate decisions in another. That is the harder half of this lab.');
  } else {
    const total = result.penTotal;
    const penKeys = result.penalties.map(p=>p.key);
    lines.push(`Cross-section penalties: −${total} pts across ${result.penalties.length} coupling${result.penalties.length>1?'s':''}. The biggest leverage on rerun is fixing the upstream choice (in Roles or Environment) instead of dropping the downstream TTP.`);
    if(penKeys.includes('roe_viol')) lines.push('A destructive TTP slipped past the RoE: that single penalty is worth more than picking 2–3 noise TTPs combined. Always vet TTP picks against your required RoE clauses first.');
  }
  // Inject narrative
  if(result.injectPts > 0)      lines.push(`Injects net +${result.injectPts}: you adapted to the curveballs without over-correcting.`);
  else if(result.injectPts < 0) lines.push(`Injects net ${result.injectPts}: at least one curveball response cost you. Re-read the inject body — the highest-scoring option is rarely the most cautious one, but it is always the one that holds the engagement to its objective.`);
  return lines.join(' ');
}

// Inject reasoning: explain why each option scored what it did.
function injectVerdict(opt){
  if(opt.score >= 5)      return 'Best response — adapts the plan without breaking objective or budget.';
  if(opt.score >= 3)      return 'Good response — keeps the engagement on track with minor cost.';
  if(opt.score === 0)     return 'Neutral — no progress, no harm, but a missed opportunity to strengthen the plan.';
  if(opt.score >= -3)     return 'Weak — minor over-correction or missed adjustment.';
  if(opt.score >= -5)     return 'Wrong direction — escalates fragility instead of resolving it.';
  return 'Incorrect — would break the engagement (legal, scope, or capability collapse).';
}

function downloadFile(filename, json){
  const blob = new Blob([JSON.stringify(json, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 200);
}
function exportJson(){
  downloadFile('lab-1.1-plan.json', { lab:'1.1', timestamp:new Date().toISOString(), state, score:computeScore(state) });
}
function exportNavigatorLayer(){
  // ATT&CK Navigator layer schema (4.5) — compatible with mitre-attack/attack-navigator
  const techniques = state.ttps.map(id=>{
    const t = TTPS.find(x=>x.id===id);
    if(!t) return null;
    let score, comment;
    if(t.violates === 'roe'){ score = 10;  comment = 'Picked but violates RoE — destructive'; }
    else if(t.tag === 'noise'){ score = 25; comment = 'Off-profile / noise'; }
    else if(t.tag === 'other'){ score = 50; comment = 'Diverged — reads as ' + (t.actor || 'other actor'); }
    else                       { score = 100; comment = 'Crimson Viper observed — aligned'; }
    return { techniqueID:id, score, color:'', comment, enabled:true, metadata:[], links:[], showSubtechniques:false };
  }).filter(Boolean);

  const layer = {
    name: 'Lab 1.1 — Crimson Viper Engagement (NOVA Corp)',
    versions: { attack:'19', navigator:'5.3.2', layer:'4.5' },
    domain: 'enterprise-attack',
    description: 'TTP loadout produced by the Lab 1.1 Engagement Planner. Score 100 = CV observed, 50 = other-actor, 25 = off-profile, 10 = RoE-violating.',
    filters: { platforms:['Linux','macOS','Windows','Network','PRE','Containers','Office Suite','Identity Provider','SaaS','IaaS'] },
    sorting: 0,
    layout: { layout:'side', aggregateFunction:'average', showID:false, showName:true, showAggregateScores:false, countUnscored:false, expandedSubtechniques:'none' },
    hideDisabled: false,
    techniques,
    gradient: { colors:['#ff6666ff','#ffe766ff','#8ec843ff'], minValue:0, maxValue:100 },
    legendItems: [
      {label:'Aligned (CV observed)',  color:'#8ec843ff'},
      {label:'Diverged (other actor)', color:'#ffe766ff'},
      {label:'Off-profile / RoE viol.', color:'#ff6666ff'},
    ],
    metadata: [],
    links: [],
    showTacticRowBackground: false,
    tacticRowBackground: '#dddddd',
    selectTechniquesAcrossTactics: true,
    selectSubtechniquesWithParent: false,
    selectVisibleTechniques: false,
  };
  downloadFile('lab-1.1-attack-navigator-layer.json', layer);
}

/* =====================================================================
   INJECTS — selection, modal, action effects
===================================================================== */
function ensureInjectQueue(){
  if(state.injectQueue && state.injectQueue.length > 0) return;
  const ids = INJECTS.map(i => i.id);
  // Fisher-Yates shuffle, take 3
  for(let i = ids.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [ids[i], ids[j]] = [ids[j], ids[i]];
  }
  state.injectQueue = ids.slice(0, 3);
  persist();
}

function pendingInjectFor(sectionKey){
  return state.injectQueue
    .map(id => INJECTS.find(i => i.id === id))
    .filter(Boolean)
    .find(inj => inj.triggerAfter === sectionKey && !state.injectsResponded[inj.id]);
}

function applyInjectAction(action, target){
  if(action === 'add_roe'){
    if(!state.roe.includes(target)){
      if(state.roe.length >= 5) state.roe.shift();
      state.roe.push(target);
    }
  } else if(action === 'add_role'){
    if(!state.roles.includes(target)){
      if(state.roles.length >= 6) state.roles.shift();
      state.roles.push(target);
    }
  } else if(action === 'swap_in_ttp'){
    if(!state.ttps.includes(target)){
      // drop the lowest-value TTP first (noise > other > observed)
      const order = id => {
        const t = TTPS.find(x => x.id === id);
        return t ? (t.tag === 'noise' ? 0 : t.tag === 'other' ? 1 : 2) : 99;
      };
      const sorted = [...state.ttps].sort((a,b) => order(a) - order(b));
      if(sorted.length >= 6){
        const drop = sorted[0];
        state.ttps = state.ttps.filter(id => id !== drop);
        delete state.detectionMap[drop];
      }
      state.ttps.push(target);
    }
  } else if(action === 'drop_env_sensor'){
    const candidates = state.environment
      .map(id => ENVIRONMENT_SENSORS.find(e => e.id === id))
      .filter(s => s && !s.critical)
      .sort((a,b) => b.cost - a.cost);
    if(candidates.length > 0){
      state.environment = state.environment.filter(id => id !== candidates[0].id);
    }
  }
}

let pendingNavStep = null;
function showInjectModal(inj){
  const modal = document.getElementById('imodal');
  const card = modal.querySelector('.icard');
  clear(card);
  card.appendChild((() => {
    const d = el('div',{cls:'ihead'});
    d.appendChild(el('div',{cls:'ieyebrow', text:'Inject · Curveball during planning'}));
    d.appendChild(el('div',{cls:'ititle', text:inj.title}));
    return d;
  })());
  card.appendChild((() => {
    const d = el('div',{cls:'ibody', text:inj.body});
    return d;
  })());
  const opts = el('div',{cls:'iopts'});
  inj.options.forEach(o => {
    const b = el('button',{cls:'iopt', text:o.label});
    b.addEventListener('click', ()=>{
      state.injectsResponded[inj.id] = o.id;
      if(o.action) applyInjectAction(o.action, o.target);
      persist();
      modal.classList.remove('open');
      // proceed with the deferred nav advance
      if(pendingNavStep !== null){
        state.step = pendingNavStep;
        pendingNavStep = null;
        persist();
        renderAll();
      } else {
        renderAll();
      }
      toast({title:'Inject resolved', em:inj.title.split(' · ')[0], body:' — choice recorded silently.'});
    });
    opts.appendChild(b);
  });
  card.appendChild(opts);
  modal.classList.add('open');
}

/* =====================================================================
   NAV
===================================================================== */
function canAdvance(){
  switch(state.step){
    case 0: return true;
    case 1: return !!state.objective;
    case 2: return state.roe.length === 5;
    case 3: return state.roles.length >= 4 && state.roles.length <= 6;
    case 4: return state.environment.length >= 4;
    case 5: return state.ttps.length === 6;
    case 6: return state.ttps.every(id => (state.detectionMap[id] || []).length > 0);
    case 7: return true;  // Review screen — always advancable
    case 8: return true;  // Score — Restart action
    default: return false;
  }
}

function updateNextButton(){
  $btnNext.disabled = !canAdvance();
}

$btnNext.addEventListener('click', ()=>{
  if(state.step === STEPS.length - 1){
    // Restart — re-roll injects too
    if(confirm('Restart the lab? All picks will be cleared.')){
      state = initialState();
      ensureInjectQueue();
      persist(); renderAll();
    }
    return;
  }
  if(!canAdvance()) return;
  // Section just completed has key STEPS[state.step].key
  const completed = STEPS[state.step].key;
  const inj = pendingInjectFor(completed);
  if(inj){
    pendingNavStep = state.step + 1;
    showInjectModal(inj);
    return;
  }
  state.step++;
  persist();
  renderAll();
});
$btnBack.addEventListener('click', ()=>{
  if(state.step === 0) return;
  state.step--;
  persist();
  renderAll();
});

function renderAll(){
  renderPath();
  renderGauge();
  renderConstraintsBand();
  renderSection();
  updateNextButton();
}

function showResetModal(){
  const modal = document.getElementById('imodal');
  const card = modal.querySelector('.icard');
  clear(card);
  const head = el('div',{cls:'ihead'});
  head.appendChild(el('div',{cls:'ieyebrow', text:'Reset · Clear all progress'}));
  head.appendChild(el('div',{cls:'ititle', text:'Restart the lab from the beginning?'}));
  card.appendChild(head);
  const body = el('div',{cls:'ibody'});
  body.appendChild(document.createTextNode('All your picks will be cleared: '));
  const emTag = document.createElement('em');
  emTag.textContent = 'objective, RoE, roles, environment, TTPs, detection mappings';
  body.appendChild(emTag);
  body.appendChild(document.createTextNode(', plus the inject queue and any answers given. The Intel Fit gauge resets to zero. '));
  const strong = document.createElement('strong');
  strong.textContent = 'This action cannot be undone.';
  body.appendChild(strong);
  card.appendChild(body);
  const opts = el('div',{cls:'iopts'});
  const cancel = el('button',{cls:'iopt', text:'Cancel — keep my progress'});
  cancel.addEventListener('click', ()=>{ modal.classList.remove('open'); });
  const confirmBtn = el('button',{cls:'iopt danger', text:'Reset — clear everything and start over'});
  confirmBtn.addEventListener('click', ()=>{
    try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
    state = initialState();
    pendingNavStep = null;
    ensureInjectQueue();
    persist();
    modal.classList.remove('open');
    renderAll();
    toast({title:'Lab reset', em:'Briefing', body:' — progress cleared. Starting over.'});
  });
  opts.appendChild(cancel);
  opts.appendChild(confirmBtn);
  card.appendChild(opts);
  modal.classList.add('open');
}
document.getElementById('btn-reset').addEventListener('click', showResetModal);

ensureInjectQueue();
renderAll();

// Test hook (read-only) — used by automated test runner
window.__lab = {
  get state(){ return state; },
  computeScore: () => computeScore(state),
  scoreFor: (s) => computeScore(s),
  data: { TTPS, INJECTS, ROE_CLAUSES, ROLES_POOL, ENVIRONMENT_SENSORS, DETECTIONS, OBJECTIVES },
};
</script>
</body>
</html>
